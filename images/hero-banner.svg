<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#0f2a4a"/>
  
  <!-- Subtle decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Campus Building outline -->
  <path d="M 100,320 L 100,180 L 180,140 L 260,180 L 260,320 Z" fill="#1b365d" stroke="#ea580c" stroke-width="2"/>
  <rect x="130" y="200" width="30" height="40" fill="#ea580c" opacity="0.8"/>
  <rect x="190" y="200" width="30" height="40" fill="#ea580c" opacity="0.8"/>
  <rect x="150" y="260" width="40" height="60" fill="#ffffff" opacity="0.9"/>
  
  <!-- Side wings -->
  <rect x="50" y="220" width="50" height="100" fill="#142942" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="260" y="220" width="70" height="100" fill="#142942" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Event Banner Stage Graphic -->
  <rect x="420" y="100" width="320" height="200" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="3"/>
  <text x="580" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">ANNUAL CAMPUS FEST 2026</text>
  <text x="580" y="180" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Workshops • Competitions • Technical Events</text>
  
  <!-- Stage lights & badges -->
  <circle cx="470" cy="230" r="24" fill="#ea580c"/>
  <text x="470" y="236" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">TECH</text>
  
  <circle cx="580" cy="230" r="24" fill="#0284c7"/>
  <text x="580" y="236" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">CODE</text>
  
  <circle cx="690" cy="230" r="24" fill="#16a34a"/>
  <text x="690" y="236" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ROBOT</text>

  <!-- Ground Line -->
  <line x1="20" y1="320" x2="780" y2="320" stroke="#ea580c" stroke-width="4"/>
  
  <!-- Banner Title Text overlay -->
  <rect x="20" y="20" width="280" height="40" rx="4" fill="#ea580c"/>
  <text x="160" y="46" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">B.TECH MINI PROJECT 2026</text>
</svg>
