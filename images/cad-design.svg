<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f2a4a"/>
  <!-- Blueprint drafting graphics -->
  <g stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4">
    <circle cx="300" cy="140" r="80" fill="none"/>
    <circle cx="300" cy="140" r="40" fill="none"/>
    <line x1="180" y1="140" x2="420" y2="140"/>
    <line x1="300" y1="40" x2="300" y2="240"/>
  </g>
  <polygon points="260,110 340,110 340,170 260,170" fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="300" cy="140" r="15" fill="#ea580c"/>

  <text x="300" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">CAD Design Challenge</text>
  <text x="300" y="285" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3D Modeling &amp; Precision Drafting</text>
  <rect x="230" y="300" width="140" height="30" rx="4" fill="#0284c7"/>
  <text x="300" y="320" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TECHNICAL</text>
</svg>
