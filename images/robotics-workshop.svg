<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#142942"/>
  <!-- Robot Icon / Graphic -->
  <rect x="220" y="70" width="160" height="130" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
  <!-- Robot Eyes -->
  <circle cx="265" cy="115" r="18" fill="#0284c7"/>
  <circle cx="335" cy="115" r="18" fill="#0284c7"/>
  <circle cx="265" cy="115" r="6" fill="#ffffff"/>
  <circle cx="335" cy="115" r="6" fill="#ffffff"/>
  <!-- Robot Mouth / Grill -->
  <rect x="260" y="155" width="80" height="15" rx="4" fill="#ea580c"/>
  <!-- Antenna -->
  <line x1="300" y1="70" x2="300" y2="40" stroke="#0284c7" stroke-width="4"/>
  <circle cx="300" cy="35" r="10" fill="#ea580c"/>
  
  <text x="300" y="240" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">Robotics Workshop</text>
  <text x="300" y="268" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Arduino &amp; Autonomous Bots</text>
  <rect x="230" y="290" width="140" height="30" rx="4" fill="#0284c7"/>
  <text x="300" y="310" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">WORKSHOP</text>
</svg>
