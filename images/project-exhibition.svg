<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f2a4a"/>
  <!-- Display Board & Podium Graphic -->
  <rect x="150" y="60" width="300" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <!-- Chart Graphic inside display board -->
  <rect x="180" y="90" width="100" height="90" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="190" y1="160" x2="270" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="200" y="130" width="15" height="30" fill="#ea580c"/>
  <rect x="225" y="110" width="15" height="50" fill="#0284c7"/>
  <rect x="250" y="100" width="15" height="60" fill="#10b981"/>
  
  <rect x="300" y="90" width="120" height="90" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="125" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PROTOTYPE</text>
  <text x="360" y="150" fill="#10b981" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">HARDWARE</text>
  
  <!-- Podium Stand -->
  <path d="M 250 210 L 350 210 L 370 240 L 230 240 Z" fill="#334155"/>

  <text x="300" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">National Project Exhibition</text>
  <rect x="230" y="295" width="140" height="30" rx="4" fill="#10b981"/>
  <text x="300" y="315" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TECHNICAL</text>
</svg>
