  <rect x="230" y="295" width="140" height="30" rx="4" fill="#0284c7"/>
  <text x="300" y="315" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TECHNICAL</text>
