  <circle cx="200" cy="100" r="10" fill="#ea580c"/>
  <circle cx="200" cy="180" r="10" fill="#ea580c"/>
  <circle cx="300" cy="70" r="10" fill="#0284c7"/>
  <circle cx="300" cy="130" r="12" fill="#38bdf8"/>
