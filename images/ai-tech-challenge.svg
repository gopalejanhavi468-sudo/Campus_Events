<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f172a"/>
  <!-- AI Neural Network Graphic -->
  <g stroke="#0284c7" stroke-width="2" opacity="0.6">
    <line x1="200" y1="100" x2="300" y2="70"/>
    <line x1="200" y1="100" x2="300" y2="130"/>
    <line x1="200" y1="180" x2="300" y2="130"/>
    <line x1="200" y1="180" x2="300" y2="190"/>
